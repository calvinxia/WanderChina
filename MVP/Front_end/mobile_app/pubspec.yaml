name: wanderchina
description: AI-Powered China Travel Companion - Your ultimate guide to exploring China
version: 0.1.0+5
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Utilities
  path: ^1.9.0      # File path utilities

  # State Management
  flutter_riverpod: ^2.4.0

  # UI & Animations
  animations: ^2.0.11
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  lottie: ^2.7.0

  # Maps & Location
  amap_map: ^1.0.15
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Camera & Image
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0

  # Utilities
  intl: ^0.18.1
  timeago: ^3.6.0
  url_launcher: ^6.2.1
  share_plus: ^10.0.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # Icons & Fonts
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.9

  # Networking
  dio: ^5.4.0
  http: ^1.1.0

  # Voice Translation
  audioplayers: ^6.0.0

  # Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  record: ^6.2.0
  amap_flutter_location: ^3.0.0

  # Analytics & Error Tracking
  sentry_flutter: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/illustrations/
    - assets/map/

  # Fonts (using Google Fonts at runtime）

