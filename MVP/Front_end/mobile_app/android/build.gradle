allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }

    // 强制高德 SDK 11.2.000:16KB page-size 合规版,取代 amap_map 插件内写死的 10.1.200
    // 高德官方声明: V11.2.000 起 GooglePlay 版已合入主干 (lbs.amap.com 2026-07)
    // 11.2.000 仅含 arm64-v8a,对应 app/build.gradle 的 abiFilters "arm64-v8a"
    configurations.all {
        resolutionStrategy {
            force 'com.amap.api:3dmap-location-search:11.2.000_loc11.2.000_sea9.8.0'
        }
    }
}

// 为缺少 namespace 的老插件自动补全(AGP 8+ 要求)
// amap_flutter_location 3.0.0 等老插件未声明 namespace
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group.toString()
                }
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
