plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.wanderchina.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.wanderchina.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug

            // 显式控制 R8 + 引用高德 keep 规则(2026-05-28)
            // 根因:AGP 8.9.1 release 默认启用 R8,无 keep 规则时会误删
            // 高德 native 反射调用的类(ClassTools 等),导致地图崩溃
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

// ============================================================================
// ABI 控制说明(2026-05)
// ----------------------------------------------------------------------------
// ABI 控制不在此文件配置,而是通过 Flutter CLI 参数完成,以绕过
// sentry_flutter 8.14.2 插件的 abiFilters 干扰。
//
// Beta 测试构建(单架构,~70MB,海外下载友好):
//     flutter build apk --release --target-platform android-arm64
//
// 兼容性构建(双架构 APK,arm64 + armv7):
//     flutter build apk --release \
//         --target-platform android-arm,android-arm64 \
//         --split-per-abi
//
// 默认构建(三架构 fat APK,~134MB,不推荐用于海外分发):
//     flutter build apk --release
//
// 注:Android 正式版开发时,应升级 sentry_flutter 到 9.x 并启用
//     splits.abi 配置,届时本注释可删除。
// ============================================================================
