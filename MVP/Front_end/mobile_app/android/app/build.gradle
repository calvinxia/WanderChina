plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ============================================================================
// 读取 release 签名配置(2026-06)
// key.properties 存放 wanderchina.jks 的路径与密码,不提交 git
// 文件位置:android/key.properties
// ============================================================================
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.wanderchina.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.wanderchina.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            // 高德 SDK 11.2.000 仅含 arm64-v8a (.so),限定 arm64-only 避免缺库崩溃
            // 现代 Android 设备(2019+)均为 64-bit,目标用户群覆盖率 >99%
            abiFilters "arm64-v8a"
        }
    }

    // ========================================================================
    // 签名配置(2026-06)
    // release 使用 wanderchina.jks,SHA1: 7D:E0:46:AE:... 对应高德「发布版安全码」
    // ========================================================================
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 使用正式 release 签名(wanderchina.jks)
            // 若 key.properties 不存在,回退到 debug 签名以保证 `flutter run --release` 仍可用
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug

            // 显式控制 R8 + 引用高德 keep 规则(2026-05-28)
            // 根因:AGP 8.9.1 release 默认启用 R8,无 keep 规则时会误删
            // 高德 native 反射调用的类(ClassTools 等),导致地图崩溃
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

// ============================================================================
// ABI 控制说明(2026-05)
// ----------------------------------------------------------------------------
// ABI 控制不在此文件配置,而是通过 Flutter CLI 参数完成,以绕过
// sentry_flutter 8.14.2 插件的 abiFilters 干扰。
//
// Beta 测试构建(单架构,~70MB,海外下载友好):
//     flutter build apk --release --target-platform android-arm64
//
// 兼容性构建(双架构 APK,arm64 + armv7):
//     flutter build apk --release \
//         --target-platform android-arm,android-arm64 \
//         --split-per-abi
//
// 默认构建(三架构 fat APK,~134MB,不推荐用于海外分发):
//     flutter build apk --release
//
// 注:Android 正式版开发时,应升级 sentry_flutter 到 9.x 并启用
//     splits.abi 配置,届时本注释可删除。
//
// 签名说明(2026-06):
//     release 构建现使用 wanderchina.jks(见 signingConfigs.release)。
//     keystore 信息存于 android/key.properties(不提交 git)。
//     SHA1 7D:E0:46:AE:... 已对应高德开放平台「发布版安全码 SHA1」。
//     debug 签名 SHA1 80:37:F4:... 已对应高德「调试版安全码 SHA1」,
//     供 `flutter run` 调试构建使用。
// ============================================================================
